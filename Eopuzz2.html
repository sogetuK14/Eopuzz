(function buildModel() {
  var i, r, c, idx;
  for (i = 0; i < CELLS; i++) {
    solution.push("");
    cellWords.push({ A: null, D: null });
    numbers.push(null);
  }
  var built = DATA.words.map(function (wd) {
    return { w: wd.w, r: wd.r, c: wd.c, d: wd.d, clue: wd.clue, num: 0, cells: [] };
  });
  built.forEach(function (word) {
    for (var k = 0; k < word.w.length; k++) {
      var rr = word.d === "D" ? word.r + k : word.r;
      var cc = word.d === "A" ? word.c + k : word.c;
      var ii = rr * SIZE + cc;
      solution[ii] = word.w.charAt(k);
      word.cells.push(ii);
      cellWords[ii][word.d] = word;
    }
  });
  isLetter = solution.map(function (s) { return s !== ""; });
  total = isLetter.filter(Boolean).length;
  var next = 0;
  for (r = 0; r < SIZE; r++) {
    for (c = 0; c < SIZE; c++) {
      idx = r * SIZE + c;
      if (!isLetter[idx]) continue;
      var sa = (c === 0 || !isLetter[idx - 1]) && c + 1 < SIZE && !!isLetter[idx + 1];
      var sd = (r === 0 || !isLetter[idx - SIZE]) && r + 1 < SIZE && !!isLetter[idx + SIZE];
      if (sa || sd) { next += 1; numbers[idx] = next; }
    }
  }
  built.forEach(function (word) { word.num = numbers[word.r * SIZE + word.c] || 0; });
  var byNum = function (a, b) { return a.num - b.num; };
  across = built.filter(function (w) { return w.d === "A"; }).sort(byNum);
  down = built.filter(function (w) { return w.d === "D"; }).sort(byNum);
})();

/* ----- state (this page only; nothing is saved) ----- */
var values = [], locked = [], wrongSet = {};
for (var vi = 0; vi < CELLS; vi++) { values.push(""); locked.push(false); }
var sel = null;
var composingIdx = -1;
var editBuf = null;
var downWasCurrent = false;

var meta = DATA.meta || null;
var metaCells = meta ? meta.cells.map(function (rc) { return rc[0] * SIZE + rc[1]; }) : [];
var metaOrder = {};
metaCells.forEach(function (idx, i) { metaOrder[idx] = i + 1; });
var metaSolved = false;

/* ----- derived helpers ----- */
function currentWord() {
  if (sel) {
    var cw = cellWords[sel.idx];
    if (cw && cw[sel.dir]) return cw[sel.dir];
    if (cw && (cw.A || cw.D)) return cw.A || cw.D;
  }
  return across[0] || down[0] || null;
}
function countFilled() {
  var n = 0;
  for (var i = 0; i < CELLS; i++) if (isLetter[i] && values[i] !== "") n++;
  return n;
}
function isComplete() {
  for (var i = 0; i < CELLS; i++) if (isLetter[i] && values[i] !== solution[i]) return false;
  return true;
}
function wordDone(w) {
  return w.cells.every(function (ci) { return values[ci] === solution[ci]; });
}
function fillMsg() {
  return total + "マス中 <strong>" + countFilled() + "マス</strong> 埋まっています";
}
function setStatus(html) {
  document.getElementById("status").innerHTML = html;
}
/* ----- painting ----- */
var cellEls = [], inputs = [], acrossRows = [], downRows = [], metaSlotChars = [];

function paintCell(idx) {
  var cell = cellEls[idx];
  var input = inputs[idx];
  if (!cell || !input) return;
  var w = currentWord();
  var cls = "cell";
  if (w && w.cells.indexOf(idx) >= 0) cls += " in-word";
  if (sel && sel.idx === idx) cls += " active";
  if (wrongSet[idx]) cls += " wrong";
  cell.className = cls;
  if (composingIdx !== idx) input.value = values[idx];
  var icls = "";
  if (locked[idx]) icls = "locked";
  if (wrongSet[idx]) icls = (icls ? icls + " " : "") + "wrong-letter";
  input.className = icls;
}
function repaint() {
  for (var i = 0; i < CELLS; i++) if (isLetter[i]) paintCell(i);
  updateChrome();
}
function updateChrome() {
  var w = currentWord();
  if (w) {
    document.getElementById("cc-num").textContent = String(w.num);
    document.getElementById("cc-dir").textContent = dirName(w.d);
    var textBox = document.getElementById("cc-text");
    textBox.innerHTML = "";
    var t = document.createElement("span");
    t.textContent = stripLen(w.clue) + " ";
    var len = document.createElement("span");
    len.className = "cc-len";
    len.textContent = "（" + w.w.length + "文字）";
    textBox.appendChild(t);
    textBox.appendChild(len);
    document.getElementById("current-clue").setAttribute(
      "aria-label",
      "現在のカギ：" + w.num + " " + dirName(w.d) + "、" + w.clue + "。タップで方向を切り替え。"
    );
  }
  acrossRows.forEach(function (row, i) {
    var ww = across[i];
    row.className = "clue-row" + (ww === w ? " sel" : "") + (wordDone(ww) ? " done" : "");
  });
  downRows.forEach(function (row, i) {
    var ww = down[i];
    row.className = "clue-row" + (ww === w ? " sel" : "") + (wordDone(ww) ? " done" : "");
  });
  metaCells.forEach(function (idx, i) {
    if (metaSlotChars[i]) metaSlotChars[i].textContent = values[idx] || "　";
  });
  var pct = total > 0 ? Math.round((countFilled() / total) * 100) : 0;
  document.getElementById("progress-fill").style.width = pct + "%";
}

/* ----- movement ----- */
function focusCell(idx) {
  var el = inputs[idx];
  if (el) { el.focus(); el.select(); }
}
function moveTo(idx, dir) {
  var cw = cellWords[idx];
  var d = dir;
  if (cw && !cw[d]) d = d === "A" ? "D" : "A";
  sel = { idx: idx, dir: d };
  repaint();
  focusCell(idx);
}
function toggleDir() {
  if (!sel) return;
  var cw = cellWords[sel.idx];
  if (!cw) return;
  var other = sel.dir === "A" ? "D" : "A";
  if (cw[other]) {
    sel = { idx: sel.idx, dir: other };
    repaint();
  }
}
function handleFocus(idx) {
  var cw = cellWords[idx];
  if (!cw) return;
  if (sel && sel.idx === idx) return;
  var dir = sel ? sel.dir : "A";
  if (!cw[dir]) dir = dir === "A" ? "D" : "A";
  if (!cw[dir]) return;
  sel = { idx: idx, dir: dir };
  repaint();
}
function gotoWord(w) {
  var target = null;
  for (var i = 0; i < w.cells.length; i++) {
    if (values[w.cells[i]] === "") { target = w.cells[i]; break; }
  }
  if (target == null) target = w.cells[0];
  if (target != null) moveTo(target, w.d);
}
function jumpClue(step) {
  var w = currentWord();
  if (!w) return;
  var ordered = across.concat(down);
  var start = ordered.indexOf(w);
  if (start < 0) return;
  for (var s = 1; s <= ordered.length; s++) {
    var cand = ordered[(((start + step * s) % ordered.length) + ordered.length) % ordered.length];
    for (var i = 0; i < cand.cells.length; i++) {
      if (values[cand.cells[i]] === "") { moveTo(cand.cells[i], cand.d); return; }
    }
  }
}
function arrowMove(key, idx) {
  var r = Math.floor(idx / SIZE), c = idx % SIZE;
  var dr = 0, dc = 0, dir = "A";
  if (key === "ArrowUp") { dr = -1; dir = "D"; }
  else if (key === "ArrowDown") { dr = 1; dir = "D"; }
  else if (key === "ArrowLeft") { dc = -1; dir = "A"; }
  else if (key === "ArrowRight") { dc = 1; dir = "A"; }
  else return;
  var nr = r + dr, nc = c + dc;
  while (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && !isLetter[nr * SIZE + nc]) {
    nr += dr;
    nc += dc;
  }
  if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) return;
  moveTo(nr * SIZE + nc, dir);
}

/* ----- typing -----
   While an IME composition is running, the input keeps showing the
   in-progress text (kept in editBuf) and nothing rewrites its value:
   resetting the value mid-composition cancels the composition itself.
   Commits are accepted from compositionend, from a non-composing input
   event, or from a blur flush, with an echo guard so the trailing
   post-commit input event cannot rewind focus. */
function applyInput(idx, raw, advance) {
  if (editBuf && editBuf.idx === idx) editBuf = null;
  var letters = extractKanaAll(raw);
  if (letters === "") {
    if (raw === "" && values[idx] !== "" && !locked[idx]) {
      values[idx] = "";
      if (wrongSet[idx]) delete wrongSet[idx];
      repaint();
      setStatus(fillMsg());
    } else {
      paintCell(idx);
    }
    return;
  }
  var cw = cellWords[idx];
  var w = (sel && cw && cw[sel.dir]) || (cw && (cw.A || cw.D)) || null;
  var cells = w ? w.cells : [idx];
  var startPos = Math.max(0, cells.indexOf(idx));
  var lastPos = startPos;
  for (var k = 0; k < letters.length; k++) {
    var ci = cells[startPos + k];
    if (ci == null) break;
    lastPos = startPos + k;
    if (locked[ci]) continue;
    values[ci] = letters.charAt(k);
    if (wrongSet[ci]) delete wrongSet[ci];
  }
  repaint();
  if (isComplete()) {
    setStatus("完成しました。");
  } else if (countFilled() === total) {
    setStatus("すべてのマスが埋まりましたが、間違っている文字があります。「チェック」で確認できます。");
  } else {
    setStatus(fillMsg());
  }
  if (advance && w) {
    if (lastPos < cells.length - 1) moveTo(cells[lastPos + 1], w.d);
    else if (cells[lastPos] != null && cells[lastPos] !== idx) moveTo(cells[lastPos], w.d);
  }
}
function handleKeyDown(e, idx) {
  if (e.isComposing) return;
  if (e.key === "Backspace") {
    e.preventDefault();
    if (values[idx] !== "" && !locked[idx]) {
      values[idx] = "";
      if (wrongSet[idx]) delete wrongSet[idx];
      repaint();
      setStatus(fillMsg());
    } else {
      var w = currentWord();
      if (w) {
        var pos = w.cells.indexOf(idx);
        if (pos > 0) moveTo(w.cells[pos - 1], w.d);
      }
    }
  } else if (e.key === "Enter" || e.key === "Tab") {
    e.preventDefault();
    jumpClue(e.shiftKey ? -1 : 1);
  } else if (e.key.indexOf("Arrow") === 0) {
    e.preventDefault();
    arrowMove(e.key, idx);
  } else if (e.key === " ") {
    if (values[idx] === "") e.preventDefault();
  }
}

/* ----- board DOM ----- */
(function buildBoard() {
  var board = document.getElementById("board");
  for (var bi = 0; bi < CELLS; bi++) {
    (function (idx) {
      if (!isLetter[idx]) {
        var block = document.createElement("div");
        block.className = "cell block";
        block.setAttribute("aria-hidden", "true");
        board.appendChild(block);
        cellEls[idx] = block;
        inputs[idx] = null;
        return;
      }
      var cell = document.createElement("div");
      cell.className = "cell";
      cell.setAttribute("role", "gridcell");
      var num = numbers[idx];
      if (num != null) {
        var ns = document.createElement("span");
        ns.className = "num";
        ns.setAttribute("aria-hidden", "true");
        ns.textContent = String(num);
        cell.appendChild(ns);
      }
      if (metaOrder[idx] != null) {
        var ring = document.createElement("span");
        ring.className = "meta-ring";
        ring.setAttribute("aria-hidden", "true");
        cell.appendChild(ring);
        var ord = document.createElement("span");
        ord.className = "meta-order";
        ord.setAttribute("aria-hidden", "true");
        ord.textContent = String(metaOrder[idx]);
        cell.appendChild(ord);
      }
      var input = document.createElement("input");
      input.setAttribute("autocomplete", "off");
      input.setAttribute("autocorrect", "off");
      input.setAttribute("autocapitalize", "none");
      input.setAttribute("spellcheck", "false");
      input.setAttribute("enterkeyhint", "next");
      var cw0 = cellWords[idx];
      var pw = cw0.A || cw0.D;
      var label = (Math.floor(idx / SIZE) + 1) + "行目、" + (idx % SIZE + 1) + "列目、カギ " + (pw ? pw.num : "");
      if (metaOrder[idx] != null) label += "、答えの" + metaOrder[idx] + "文字目";
      input.setAttribute("aria-label", label);
      input.addEventListener("input", function (e) {
        if (e.isComposing) {
          editBuf = { idx: idx, text: input.value };
          return;
        }
        if (editBuf && editBuf.idx === idx) editBuf = null;
        if (input.value !== "" && input.value === values[idx]) return;
        applyInput(idx, input.value, true);
      });
      input.addEventListener("compositionstart", function () {
        composingIdx = idx;
      });
      input.addEventListener("compositionend", function (e) {
        composingIdx = -1;
        var buffered = editBuf && editBuf.idx === idx ? editBuf.text : "";
        editBuf = null;
        var text = e.data ? e.data : input.value ? input.value : buffered;
        if (text !== "" && text === values[idx]) {
          paintCell(idx);
          return;
        }
        applyInput(idx, text, true);
      });
      input.addEventListener("blur", function () {
        var buf = editBuf;
        if (!buf || buf.idx !== idx) return;
        editBuf = null;
        if (extractKanaAll(buf.text) === "") { paintCell(idx); return; }
        if (buf.text === values[idx]) { paintCell(idx); return; }
        applyInput(idx, buf.text, false);
      });
      input.addEventListener("keydown", function (e) { handleKeyDown(e, idx); });
      input.addEventListener("focus", function () {
        handleFocus(idx);
        input.select();
      });
      input.addEventListener("pointerdown", function () {
        downWasCurrent = !!sel && sel.idx === idx;
      });
      input.addEventListener("click", function () {
        if (downWasCurrent) toggleDir();
      });
      cell.appendChild(input);
      board.appendChild(cell);
      cellEls[idx] = cell;
      inputs[idx] = input;
    })(bi);
  }
})();

/* ----- clue lists ----- */
function buildClueList(list, containerId) {
  var container = document.getElementById(containerId);
  var rows = [];
  list.forEach(function (w) {
    var row = document.createElement("div");
    row.className = "clue-row";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "clue-btn";
    btn.setAttribute("aria-label", "カギ " + w.num + " " + dirName(w.d) + "：" + w.clue);
    var num = document.createElement("span");
    num.className = "cl-num";
    num.textContent = String(w.num);
    var text = document.createElement("span");
    text.className = "cl-text";
    text.textContent = stripLen(w.clue) + " ";
    var len = document.createElement("span");
    len.className = "cl-len";
    len.textContent = "（" + w.w.length + "文字）";
    text.appendChild(len);
    btn.appendChild(num);
    btn.appendChild(text);
    btn.addEventListener("click", function () { gotoWord(w); });
    row.appendChild(btn);
    container.appendChild(row);
    rows.push(row);
  });
  return rows;
}
acrossRows = buildClueList(across, "clues-across");
downRows = buildClueList(down, "clues-down");

/* ----- toolbar ----- */
document.getElementById("current-clue").addEventListener("click", function () {
  toggleDir();
});
document.getElementById("btn-check").addEventListener("click", function () {
  var correct = 0, wrongN = 0, empty = 0;
  wrongSet = {};
  for (var i = 0; i < CELLS; i++) {
    if (!isLetter[i]) continue;
    var v = values[i];
    if (v === "") empty++;
    else if (v === solution[i]) { correct++; locked[i] = true; }
    else { wrongN++; wrongSet[i] = true; }
  }
  repaint();
  if (wrongN === 0 && empty === 0) {
    setStatus("完成しました。");
  } else {
    setStatus("チェック：正解 " + correct + " ・ 不正解 " + wrongN + "（赤で表示） ・ 空き " + empty + "。正解のマスはロックされました。");
  }
});
var confirmRow = document.getElementById("confirm-row");
document.getElementById("btn-clear").addEventListener("click", function () {
  confirmRow.style.display = "flex";
});
document.getElementById("btn-clear-no").addEventListener("click", function () {
  confirmRow.style.display = "none";
});
document.getElementById("btn-clear-yes").addEventListener("click", function () {
  for (var i = 0; i < CELLS; i++) { values[i] = ""; locked[i] = false; }
  wrongSet = {};
  editBuf = null;
  confirmRow.style.display = "none";
  repaint();
  setStatus("グリッドをクリアしました。最初からどうぞ。");
  var first = across[0] || down[0];
  if (first && first.cells[0] != null) moveTo(first.cells[0], first.d);
});

/* ----- theme answer (meta) ----- */
if (meta) {
  var slotsBox = document.getElementById("meta-slots");
  metaCells.forEach(function (idx, i) {
    var slot = document.createElement("span");
    slot.className = "meta-slot";
    var n = document.createElement("span");
    n.className = "meta-slot-num";
    n.setAttribute("aria-hidden", "true");
    n.textContent = String(i + 1);
    var ch = document.createElement("span");
    ch.className = "meta-slot-char";
    ch.textContent = "　";
    slot.appendChild(n);
    slot.appendChild(ch);
    slotsBox.appendChild(slot);
    metaSlotChars.push(ch);
  });
  if (meta.question && /[？?]$/.test(meta.question)) {
    var qm = document.createElement("span");
    qm.className = "meta-qmark";
    qm.setAttribute("aria-hidden", "true");
    qm.textContent = meta.question.slice(-1);
    slotsBox.appendChild(qm);
  }
  var metaInput = document.getElementById("meta-input");
  metaInput.addEventListener("input", function () {
    document.getElementById("meta-empty").style.display = "none";
    document.getElementById("meta-wrong").style.display = "none";
  });
  document.getElementById("meta-form").addEventListener("submit", function (e) {
    e.preventDefault();
    if (metaSolved) return;
    var guess = extractKanaAll(metaInput.value);
    var emptyMsg = document.getElementById("meta-empty");
    var wrongMsg = document.getElementById("meta-wrong");
    if (guess === "") {
      emptyMsg.style.display = "block";
      wrongMsg.style.display = "none";
      return;
    }
    emptyMsg.style.display = "none";
    if (guess === meta.answer) {
      metaSolved = true;
      document.getElementById("meta-form").style.display = "none";
      document.getElementById("meta-answer-echo").textContent = meta.answer;
      document.getElementById("meta-solved").style.display = "block";
    } else {
      wrongMsg.style.display = "block";
    }
  });
}

/* ----- init ----- */
var firstWord = across[0] || down[0];
if (firstWord && firstWord.cells[0] != null) {
  sel = { idx: firstWord.cells[0], dir: firstWord.d };
}
repaint();
setStatus(total + "マス中 <strong>0マス</strong> 埋まっています ・ ヨコ " + across.length + " ・ タテ " + down.length);
</script>
  </body>
</html>
