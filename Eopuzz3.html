"use strict";

,73,208,61,10,149,106,199],"wordGroups":[{"len":3,"words":["クルル","ケアル","ナイト","ラムウ"]},{"len":4,"words":["エーテル","エレゼン","タイタン","ダラガブ","ハウケタ","モルボル"]},{"len":5,"words":["アルフィノ","イフリート","バハムート","ヤシュトラ","ルガディン"]},{"len":6,"words":["ウリエンジェ","カーバンクル","サボテンダー","サンクレッド","ショウカンシ"]},{"len":8,"words":["ゴールドソーサー"]}],"answer":"ナルザル"};
var W = DATA.w, H = DATA.h, CELLS = W * H;
var solution = DATA.solution;
var isLetter = solution.map(function (s) { return s !== ""; });
var total = isLetter.filter(Boolean).length;
var slots = DATA.slots;
var cellWords = [];
for (var i0 = 0; i0 < CELLS; i0++) cellWords.push({ A: null, D: null });
slots.forEach(function (s) {
  s.cells.forEach(function (ci) { cellWords[ci][s.d] = s; });
});
var metaCells = DATA.marks;
var metaOrder = {};
metaCells.forEach(function (idx, i) { metaOrder[idx] = i + 1; });

function toKatakana(input) {
  var out = "";
  var chars = Array.from(input);
  for (var i = 0; i < chars.length; i++) {
    var code = chars[i].codePointAt(0);
    if (code >= 0x3041 && code <= 0x3096) out += String.fromCodePoint(code + 0x60);

}
function extractKanaAll(raw) {
  return toKatakana(raw).replace(/[^ァ-ヶー]/g, "");
}
function dirName(d) { return d === "A" ? "ヨコ" : "タテ"; }

/* ----- state (this page only; nothing is saved) ----- */
var values = [], locked = [], wrongSet = {};
for (var vi = 0; vi < CELLS; vi++) { values.push(""); locked.push(false); }
var sel = null;
var composingIdx = -1;
var editBuf = null;
var downWasCurrent = false;
var metaSolved = false;

function currentWord() {
  if (sel) {
    var cw = cellWords[sel.idx];
    if (cw && cw[sel.dir]) return cw[sel.dir];
    if (cw && (cw.A || cw.D)) return cw.A || cw.D;
  }
  return slots[0] || null;
}
function countFilled() {
  var n = 0;
  for (var i = 0; i < CELLS; i++) if (isLetter[i] && values[i] !== "") n++;

}
function isComplete() {
  for (var i = 0; i < CELLS; i++) if (isLetter[i] && values[i] !== solution[i]) return false;
  return true;
}
function fillMsg() {
  return total + "マス中 <strong>" + countFilled() + "マス</strong> 埋まっています";
}
function setStatus(html) {
  document.getElementById("status").innerHTML = html;
}
function computeUsed() {
  var counts = {};
  slots.forEach(function (s) {
    var str = "";
    var full = true;
    s.cells.forEach(function (ci) {
      if (values[ci] === "") full = false;
      str += values[ci];
    });
    if (full) counts[str] = (counts[str] || 0) + 1;
  });
  var used = {};
  var remaining = {};
  for (var k in counts) remaining[k] = counts[k];
  DATA.wordGroups.forEach(function (g) {
    g.words.forEach(function (w) {
      var c = remaining[w] || 0;
      if (c > 0) { used[w] = true; remaining[w] = c - 1; }
    });
  });
  return used;
}

/* ----- painting ----- */
var cellEls = [], inputs = [], metaSlotChars = [], wordEls = [];

function paintCell(idx) {
  var cell = cellEls[idx];
  var input = inputs[idx];
  if (!cell || !input) return;
  var w = currentWord();
  var cls = "cell";
  if (w && w.cells.indexOf(idx) >= 0) cls += " in-word";
  if (sel && sel.idx === idx) cls += " active";
  if (wrongSet[idx]) cls += " wrong";
  cell.className = cls;
  if (composingIdx !== idx) input.value = values[idx];
  var icls = "";
  if (locked[idx]) icls = "locked";
  if (wrongSet[idx]) icls = (icls ? icls + " " : "") + "wrong-letter";
  input.className = icls;
}
function repaint() {
  for (var i = 0; i < CELLS; i++) if (isLetter[i]) paintCell(i);
  updateChrome();
}
function updateChrome() {
  var w = currentWord();
  if (w) {
    document.getElementById("cc-dir").textContent = dirName(w.d);
    document.getElementById("cc-text").textContent = w.cells.length + "文字の単語";

  metaCells.forEach(function (idx, i) {
    if (metaSlotChars[i]) metaSlotChars[i].textContent = values[idx] || "　";

  var used = computeUsed();
  wordEls.forEach(function (rec) {
    rec.el.className = "ww" + (used[rec.w] ? " used" : "");

  var pct = total > 0 ? Math.round((countFilled() / total) * 100) : 0;
  document.getElementById("progress-fill").style.width = pct + "%";

/* ----- movement ----- */
function focusCell(idx) {
  var el = inputs[idx];
  if (el) { el.focus(); el.select(); }
}
function moveTo(idx, dir) {
  var cw = cellWords[idx];
  if (!cw) return;
  var d = dir;
  if (!cw[d]) d = d === "A" ? "D" : "A";
  if (!cw[d]) return;

function toggleDir() {
  if (!sel) return;

  var other = sel.dir === "A" ? "D" : "A";
  if (cw[other]) {
    sel = { idx: sel.idx, dir: other };

  }
}
function handleFocus(idx) {
  var cw = cellWords[idx];
  if (!cw) return;
  if (sel && sel.idx === idx) return;
  var dir = sel ? sel.dir : "A";
  if (!cw[dir]) dir = dir === "A" ? "D" : "A";
  if (!cw[dir]) return;
  sel = { idx: idx, dir: dir };

function jumpSlot(step) {
  var w = currentWord();
  if (!w) return;

    var cand = slots[(((start + step * s) % slots.length) + slots.length) % slots.length];

function arrowMove(key, idx) {

  var dr = 0, dc = 0, dir = "A";

  else if (key === "ArrowRight") { dc = 1; dir = "A"; }
  else return;
  var nr = r + dr, nc = c + dc;
  while (nr >= 0 && nr < H && nc >= 0 && nc < W && !isLetter[nr * W + nc]) {

    nc += dc;

  if (nr < 0 || nr >= H || nc < 0 || nc >= W) return;
  moveTo(nr * W + nc, dir);
}

/* ----- typing ----- */
function applyInput(idx, raw, advance) {
  if (editBuf && editBuf.idx === idx) editBuf = null;
  var letters = extractKanaAll(raw);

    if (raw === "" && values[idx] !== "" && !locked[idx]) {

    if (lastPos < cells.length - 1) moveTo(cells[lastPos + 1], w.d);

  if (e.key === "Backspace") {
    e.preventDefault();
    if (values[idx] !== "" && !locked[idx]) {
      values[idx] = "";
      if (wrongSet[idx]) delete wrongSet[idx];
      repaint();
      setStatus(fillMsg());
    } else {
      var w = currentWord();
      if (w) {
        var pos = w.cells.indexOf(idx);
        if (pos > 0) moveTo(w.cells[pos - 1], w.d);
      }
    }
  } else if (e.key === "Enter" || e.key === "Tab") {
    e.preventDefault();
    jumpSlot(e.shiftKey ? -1 : 1);
  } else if (e.key.indexOf("Arrow") === 0) {
    e.preventDefault();
    arrowMove(e.key, idx);
  } else if (e.key === " ") {
    if (values[idx] === "") e.preventDefault();
  }
}

/* ----- board DOM ----- */
(function buildBoard() {
  var board = document.getElementById("board");
  board.style.gridTemplateColumns = "repeat(" + W + ", 1fr)";
  board.style.gridTemplateRows = "repeat(" + H + ", 1fr)";
  for (var bi = 0; bi < CELLS; bi++) {
    (function (idx) {
      if (!isLetter[idx]) {
        var block = document.createElement("div");
        block.className = "cell block";
        block.setAttribute("aria-hidden", "true");
        board.appendChild(block);
        cellEls[idx] = block;
        inputs[idx] = null;
        return;
      }
      var cell = document.createElement("div");
      cell.className = "cell";
      cell.setAttribute("role", "gridcell");
      if (metaOrder[idx] != null) {
        var ring = document.createElement("span");
        ring.className = "meta-ring";
        ring.setAttribute("aria-hidden", "true");
        cell.appendChild(ring);
        var ord = document.createElement("span");
        ord.className = "meta-order";
        ord.setAttribute("aria-hidden", "true");
        ord.textContent = String(metaOrder[idx]);
        cell.appendChild(ord);
      }
      var input = document.createElement("input");
      input.setAttribute("autocomplete", "off");
      input.setAttribute("autocorrect", "off");
      input.setAttribute("autocapitalize", "none");
      input.setAttribute("spellcheck", "false");
      input.setAttribute("enterkeyhint", "next");
      input.setAttribute("aria-label", "盤面 " + (Math.floor(idx / W) + 1) + "行 " + (idx % W + 1) + "列");
      input.addEventListener("input", function (e) {
        if (e.isComposing) {
          editBuf = { idx: idx, text: input.value };
          return;
        }
        if (editBuf && editBuf.idx === idx) editBuf = null;
        if (input.value !== "" && input.value === values[idx]) return;
        applyInput(idx, input.value, true);
      });
      input.addEventListener("compositionstart", function () {
        composingIdx = idx;
      });
      input.addEventListener("compositionend", function (e) {
        composingIdx = -1;
        var buffered = editBuf && editBuf.idx === idx ? editBuf.text : "";
        editBuf = null;
        var text = e.data ? e.data : input.value ? input.value : buffered;
        if (text !== "" && text === values[idx]) {
          paintCell(idx);
          return;
        }
        applyInput(idx, text, true);
      });
      input.addEventListener("blur", function () {
        var buf = editBuf;
        if (!buf || buf.idx !== idx) return;
        editBuf = null;
        if (extractKanaAll(buf.text) === "") { paintCell(idx); return; }
        if (buf.text === values[idx]) { paintCell(idx); return; }
        applyInput(idx, buf.text, false);
      });
      input.addEventListener("keydown", function (e) { handleKeyDown(e, idx); });
      input.addEventListener("focus", function () {
        handleFocus(idx);
        input.select();
      });
      input.addEventListener("pointerdown", function () {
        downWasCurrent = !!sel && sel.idx === idx;
      });
      input.addEventListener("click", function () {
        if (downWasCurrent) toggleDir();
      });
      cell.appendChild(input);
      board.appendChild(cell);
      cellEls[idx] = cell;
      inputs[idx] = input;
    })(bi);
  }
})();

/* ----- word list ----- */
(function buildWordList() {
  var container = document.getElementById("word-list");
  DATA.wordGroups.forEach(function (g) {
    var group = document.createElement("div");
    group.className = "wgroup";
    var head = document.createElement("p");
    head.className = "wl";
    head.textContent = g.len + "文字";
    group.appendChild(head);
    g.words.forEach(function (w) {
      var p = document.createElement("p");
      p.className = "ww";
      p.textContent = "・" + w;
      group.appendChild(p);
      wordEls.push({ w: w, el: p });
    });
    container.appendChild(group);
  });
})();

/* ----- meta slots ----- */
(function buildMeta() {
  var slotsBox = document.getElementById("meta-slots");
  metaCells.forEach(function (idx, i) {
    var slot = document.createElement("div");
    slot.className = "meta-slot";
    var n = document.createElement("span");
    n.className = "meta-slot-num";
    n.textContent = String(i + 1);
    var ch = document.createElement("span");
    ch.className = "meta-slot-char";
    ch.textContent = "　";
    slot.appendChild(n);
    slot.appendChild(ch);
    slotsBox.appendChild(slot);
    metaSlotChars.push(ch);
  });
})();

/* ----- toolbar ----- */
document.getElementById("current-clue").addEventListener("click", function () {
  toggleDir();
});
document.getElementById("btn-check").addEventListener("click", function () {
  var correct = 0, wrongN = 0, empty = 0;
  wrongSet = {};
  for (var i = 0; i < CELLS; i++) {
    if (!isLetter[i]) continue;
    var v = values[i];
    if (v === "") empty++;
    else if (v === solution[i]) { correct++; locked[i] = true; }
    else { wrongN++; wrongSet[i] = true; }
  }
  repaint();
  if (wrongN === 0 && empty === 0) {
    setStatus("完成しました。");
  } else {
    setStatus("チェック：正解 " + correct + " ・ 不正解 " + wrongN + "（赤で表示） ・ 空き " + empty + "。正解のマスはロックされました。");
  }
});
var confirmRow = document.getElementById("confirm-row");
document.getElementById("btn-clear").addEventListener("click", function () {
  confirmRow.style.display = "flex";
});
document.getElementById("btn-clear-no").addEventListener("click", function () {
  confirmRow.style.display = "none";
});
document.getElementById("btn-clear-yes").addEventListener("click", function () {
  for (var i = 0; i < CELLS; i++) { values[i] = ""; locked[i] = false; }
  wrongSet = {};
  editBuf = null;
  confirmRow.style.display = "none";
  repaint();
  setStatus(fillMsg());
});

/* ----- meta answer (button click / Enter: immediate judgement) ----- */
function checkMeta() {
  if (metaSolved) return;
  var input = document.getElementById("meta-input");
  var v = extractKanaAll(input.value);
  var wrongMsg = document.getElementById("meta-wrong");
  if (!v) {
    wrongMsg.textContent = "答えが入力されていません。カタカナで入力してください。";
    wrongMsg.style.display = "block";
    return;
  }
  if (v === DATA.answer) {
    metaSolved = true;
    wrongMsg.style.display = "none";
    document.getElementById("meta-form").style.display = "none";
    document.getElementById("meta-answer-echo").textContent = DATA.answer;
    document.getElementById("meta-solved").style.display = "block";
  } else {
    wrongMsg.textContent = "ちがうみたい。もう一度どうぞ。";
    wrongMsg.style.display = "block";
  }
}
document.getElementById("btn-meta").addEventListener("click", checkMeta);
document.getElementById("meta-input").addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.isComposing) {
    e.preventDefault();
    checkMeta();
  }
});
document.getElementById("meta-input").addEventListener("input", function () {
  document.getElementById("meta-wrong").style.display = "none";
});

/* ----- init ----- */
if (slots[0] && slots[0].cells[0] != null) {
  sel = { idx: slots[0].cells[0], dir: slots[0].d };
}
repaint();
setStatus(fillMsg());
</script>
